# ===========================================================================
# PhotoPrism for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : photoprism/photoprism:261029 (Docker Hub, used unmodified)
#                  -> https://github.com/photoprism/photoprism
#
# Ports   : host 8022 -> container 2342. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/photoprismdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : PhotoPrism only creates its first administrator when PHOTOPRISM_ADMIN_PASSWORD
#           is set. The wrapper generates a random password once, stores it in the mounted
#           storage volume, prints it to the log, then hands over to the image's original
#           /init. It is not a privilege wrapper: the container still runs as uid 1000 and
#           the upstream image is unmodified.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  photoprismdocker:
    image: photoprism/photoprism:261029
    container_name: photoprismdocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    ports:
      - "8022:2342"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/photoprismdocker/storage:/photoprism/storage
      - /Volume1/DockerAppData/photoprismdocker/originals:/photoprism/originals
      - /Volume1/DockerAppData/photoprismdocker/import:/photoprism/import
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:2342/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8022
    protocol: http
